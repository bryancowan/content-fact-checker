name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The suite is fully offline -- tests/conftest.py stubs the Cerebras and
      # Parallel SDKs -- so no API keys or secrets are needed here.
      - name: Test
        run: pytest -q
