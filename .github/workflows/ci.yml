name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only checks out the code and runs lint and tests, so the token needs no more
# than read access; set explicitly rather than relying on the repo-wide default.
permissions:
  contents: read

jobs:
  test:
    # Branch protection requires a check named exactly "test", so the 3.13 leg keeps that name
    # and the other legs report as "test (<version>)". Production on Render runs 3.14.
    name: ${{ matrix.python-version == '3.13' && 'test' || format('test ({0})', matrix.python-version) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The suite is fully offline -- tests/conftest.py stubs the Cerebras and
      # Parallel SDKs -- so no API keys or secrets are needed here.
      - name: Test
        run: pytest -q
