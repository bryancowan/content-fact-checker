services:
  - type: web
    name: content-fact-checker
    runtime: python
    pythonVersion: "3.13"
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run web_app.py --server.headless true --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: CEREBRAS_API_KEY
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
      # Lets a deprecated model be swapped from the Render dashboard without a deploy.
      - key: CEREBRAS_MODEL_NAME
        value: qwen-3.8-27b
