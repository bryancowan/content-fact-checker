# This service was created by hand in the Render dashboard and is NOT Blueprint-managed, so Render
# ignores this file: the dashboard settings are what run. When you change the build command, start
# command, Python version or env vars here, change them in the dashboard too (Settings), and keep
# the two in step. The values below mirror what was running on 2026-10-26.
services:
  - type: web
    name: content-fact-checker
    runtime: python
    pythonVersion: "3.14"
    buildCommand: pip install -r requirements.txt && python scripts/patch_streamlit_favicon.py
    startCommand: streamlit run web_app.py --server.headless true --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
      # "openai", "cerebras" or "openrouter". Switching is a dashboard change and a restart.
      - key: LLM_PROVIDER
        value: openai
      # Only needed to switch LLM_PROVIDER to cerebras.
      - key: CEREBRAS_API_KEY
        sync: false
      # Only needed to switch LLM_PROVIDER to openrouter.
      - key: OPENROUTER_API_KEY
        sync: false
      # Defaults to gpt-6-luna. Set LLM_MODEL_NAME from the Render dashboard to
      # swap a deprecated model without a deploy.
